name: portfolio-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20243
      - run
      - --token-file
      - /run/secrets/tunnel-token
    volumes:
      - ${CLOUDFLARE_TOKEN_FILE:-./tunnel-token}:/run/secrets/tunnel-token:ro
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
