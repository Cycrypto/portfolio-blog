name: CI

on:
  pull_request:
  push:
    branches: [main, codex/deploy-redesigned-portfolio]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://junha.space
      - run: npm run typecheck

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-blog:ci .
      - name: Verify production image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name portfolio-ci -p 127.0.0.1:13000:3000 \
            --tmpfs /app/data:uid=1000,gid=1000,mode=0700 portfolio-blog:ci
          trap 'docker logs portfolio-ci; docker rm -f portfolio-ci' EXIT
          for attempt in {1..60}; do
            if [[ $(docker inspect -f '{{.State.Health.Status}}' portfolio-ci) == healthy ]]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' portfolio-ci)" = healthy
          curl --fail http://127.0.0.1:13000/api/health
          curl --fail --silent http://127.0.0.1:13000/ -o /tmp/home.html
          grep -q 'Oliver Rowland' /tmp/home.html
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/blog)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/api/admin/home)" = 503
