name: Deploy (Tailscale)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 100.76.8.11
  DEPLOY_USER: ubuntu
  DEPLOY_PORT: "22"
  DEPLOY_PATH: /home/ubuntu/apps/portfolio-blog
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve Tailscale auth mode
        id: ts_auth
        shell: bash
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [[ -n "$TS_OAUTH_CLIENT_ID" && -n "$TS_OAUTH_SECRET" ]]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [[ -n "$TAILSCALE_AUTHKEY" ]]; then
            echo "mode=authkey" >> "$GITHUB_OUTPUT"
          else
            echo "Neither OAuth secrets nor TAILSCALE_AUTHKEY is configured."
            exit 1
          fi

      - name: Connect to tailnet
        if: ${{ steps.ts_auth.outputs.mode == 'oauth' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Connect to tailnet (auth key fallback)
        if: ${{ steps.ts_auth.outputs.mode == 'authkey' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 45m
          script: |
            set -eu
            hostname
            uname -m
            docker ps --format 'table {{.Names}}	{{.Image}}	{{.Status}}	{{.Ports}}'
            python3 - <<'PYINSPECT'
            import json, subprocess
            ids = subprocess.check_output(['docker','ps','-q'], text=True).split()
            for cid in ids:
                c=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
                labels=c['Config'].get('Labels') or {}
                safe={k:v for k,v in labels.items() if k in ('com.docker.compose.project','com.docker.compose.project.config_files','com.docker.compose.project.working_dir','com.docker.compose.service','traefik.enable','traefik.docker.network') or (k.startswith('traefik.http.') and any(k.endswith(suffix) for suffix in ('.rule','.entrypoints','.certresolver','.port','.service','.tls')))}
                print(json.dumps({'name':c['Name'],'labels':safe,'networks':list(c['NetworkSettings']['Networks']),'mounts':[{'source':m['Source'],'destination':m['Destination']} for m in c['Mounts']]}))
            PYINSPECT
            cd /home/ubuntu/apps/portfolio-blog
            git status --short
            ls -la docker-compose* .env* 2>/dev/null || true
