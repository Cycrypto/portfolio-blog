name: Deploy (Tailscale)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
      - name: Resolve release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select Tailscale authentication
        id: auth
        env:
          OAUTH_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET || secrets.TS_OAUTH_PASSWORD }}
          AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [[ -n "$OAUTH_ID" && -n "$OAUTH_SECRET" ]]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [[ -n "$AUTH_KEY" ]]; then
            echo "mode=authkey" >> "$GITHUB_OUTPUT"
          else
            echo "Configure Tailscale OAuth credentials or an auth key" >&2
            exit 1
          fi
      - uses: tailscale/github-action@v4
        if: steps.auth.outputs.mode == 'oauth'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET || secrets.TS_OAUTH_PASSWORD }}
          tags: ${{ vars.TAILSCALE_TAGS || 'tag:ci' }}
          retry: 1
      - uses: tailscale/github-action@v4
        if: steps.auth.outputs.mode == 'authkey'
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          retry: 1
      - name: Deploy exact release over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 100.76.8.11
          username: ubuntu
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          command_timeout: 40m
          script: |
            set -eu
            cd /home/ubuntu/apps/portfolio-blog
            git fetch origin ${{ steps.release.outputs.sha }}
            export DEPLOYMENT_VERSION=${{ steps.release.outputs.sha }}
            release_dir="$PWD/releases/$DEPLOYMENT_VERSION"
            mkdir -p "$release_dir"
            git archive "$DEPLOYMENT_VERSION" | tar -x -C "$release_dir"
            bash "$release_dir/scripts/deploy.sh" "$PWD"
      - name: Verify public website
        run: |
          curl --fail --retry 5 --retry-delay 3 https://junha.space/api/health
          curl --fail --silent https://junha.space/ -o /tmp/home.html
          grep -q 'Full Stack Developer' /tmp/home.html
