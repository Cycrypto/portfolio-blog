version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET=blog
      - S3_REGION=us-east-1
      - S3_PUBLIC_URL=http://localhost:9000/blog
      - AI_WORKER_URL=${AI_WORKER_URL:-http://ai-worker:11434}
      - AI_WORKER_TOKEN=${AI_WORKER_TOKEN}
      - AI_WORKER_TIMEOUT_MS=${AI_WORKER_TIMEOUT_MS:-30000}
    depends_on:
      - db
      - minio
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: npm run dev
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_db
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: blog-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  minio-init:
    image: minio/mc
    container_name: blog-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/blog &&
      mc anonymous set download local/blog
      "
    networks:
      - app-network

  ai-worker:
    profiles: ["ai"]
    build:
      context: ./worker
    container_name: blog-ai-worker
    environment:
      - WORKER_HOST=0.0.0.0
      - WORKER_PORT=${AI_WORKER_PORT:-11434}
      - AI_WORKER_INTERNAL_TOKEN=${AI_WORKER_TOKEN}
      - AI_WORKER_REQUEST_TIMEOUT_MS=${AI_WORKER_TIMEOUT_MS:-30000}
      - OPENAI_OAUTH_BASE_URL=${OPENAI_OAUTH_BASE_URL:-http://ai-oauth-proxy:10531/v1}
    depends_on:
      - ai-oauth-proxy
    networks:
      - app-network

  ai-oauth-proxy:
    profiles: ["ai"]
    image: node:20-alpine
    container_name: blog-ai-oauth-proxy
    working_dir: /app
    command: >
      sh -lc "npx openai-oauth --host 0.0.0.0 --port ${AI_OAUTH_PROXY_PORT:-10531} --oauth-file ${AI_OAUTH_FILE:-/root/.codex/auth.json}"
    volumes:
      - ${HOME}/.codex:/root/.codex:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  minio-data:
